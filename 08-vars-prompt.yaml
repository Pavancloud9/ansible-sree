- name: vars files
  hosts: web
  connection: local
  vars_prompt:
  - name: COURSE
    prompt: please enter course name
    private: false
  - name: DURATION
    prompt: enter duration
    private: false
  - name: TRAINER
    prompt: enter your trainer name
    private: false
  tasks:
  - name: refer vars files
    ansible.builtin.debug:
      msg: "Course is {{ COURSE }}, duration is {{ DURATION }}, trainer is {{ TRAINER }}"