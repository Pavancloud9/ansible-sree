- name: install nginx
  hosts: web
  become: yes
  tasks:
  - name: install nginx if RHEL
    ansible.builtin.dnf:
      name: zip
      state: installed
    when: ansible_facts['os_family'] == "RedHat"

  - name: install zip if ubuntu
    ansible.builtin.apt:
      name: zip
      state: installed
    when: ansible_facts['os_family'] == "debian"